# Rice hyprlock
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.cache/rice/lock.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.75
    color = rgb(121214)
}

# дата
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $on_surface
    font_size = 22
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# большие часы (тень даёт эффект обводки)
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = rgba(e6e6eaff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 2
    shadow_color = rgba(000000ee)
    shadow_boost = 2.0
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 38
    outline_thickness = 0
    rounding = 19
    inner_color = rgba(ffffff22)
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    placeholder_text = <i>Enter Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
